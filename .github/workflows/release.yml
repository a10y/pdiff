# Releases every commit on main as the next 0.N.0 version:
#   1. picks N as one more than the highest 0.N.0 among git tags and
#      crates.io (0.1.0 if neither has one),
#   2. builds a macOS arm64 binary with that version,
#   3. publishes GitHub release v0.N.0 with the binary (for `cargo binstall`),
#   4. publishes pdiff 0.N.0 to crates.io through trusted publishing
#      (https://crates.io/docs/trusted-publishing): no stored API token.
# The version lives only in the tag and the published crate; Cargo.toml on
# main keeps a 0.0.0 placeholder, so CI never has to push commits back.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases
  id-token: write # OIDC token for crates.io trusted publishing

# Runs queue rather than overlap, so two runs cannot pick the same version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    # Must match the environment set in the crate's trusted publishing config
    # on crates.io. GitHub creates it on first use; add protection rules (for
    # example, deployments from main only) under Settings > Environments.
    environment: release
    timeout-minutes: 180
    env:
      TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - uses: Swatinem/rust-cache@v2

      - name: Pick version
        run: |
          # Check crates.io too, so a version published outside CI (like the
          # first one) is never reused.
          n=$( {
            git ls-remote --tags origin 'refs/tags/v0.*.0' \
              | sed -nE 's|.*refs/tags/v0\.([0-9]+)\.0$|\1|p'
            curl -sSf -A 'pdiff-release (https://github.com/a10y/pdiff)' \
              https://crates.io/api/v1/crates/pdiff/versions \
              | jq -r '.versions[].num' | sed -nE 's/^0\.([0-9]+)\.0$/\1/p' \
              || true
          } | sort -n | tail -1)
          version="0.$(( ${n:-0} + 1 )).0"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # Stamp the version into the manifest and lockfile (not committed).
          sed -i '' -E "s/^version = \"0\.0\.0\"$/version = \"$version\"/" Cargo.toml
          grep -q "^version = \"$version\"$" Cargo.toml
          cargo update --workspace --offline
          echo "Releasing $version"

      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Package
        run: |
          bin="target/$TARGET/release/pdiff"
          otool -L "$bin"
          tar -czf "pdiff-$TARGET.tar.gz" -C "$(dirname "$bin")" pdiff
          shasum -a 256 "pdiff-$TARGET.tar.gz" > "pdiff-$TARGET.tar.gz.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "pdiff-$TARGET.tar.gz" "pdiff-$TARGET.tar.gz.sha256" \
            --target "$GITHUB_SHA" \
            --title "pdiff $VERSION" \
            --notes "Built from $GITHUB_SHA on main." \
            --latest

      # After the GitHub release, so `cargo binstall pdiff` finds the binary
      # as soon as the version is on crates.io. The token from trusted
      # publishing lasts 30 minutes, so get it here, after the long build.
      - name: Authenticate with crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@v1

      # --no-verify skips rebuilding Servo from the packaged sources; the
      # Build step just compiled them.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo publish --locked --no-verify --allow-dirty
